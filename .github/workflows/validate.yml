name: Validate and build
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate content and run tests
        run: |
          python scripts/validate_content.py
          python -m unittest discover -s tests -v
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
      - name: Test actual Jekyll build with isolated records
        run: python scripts/smoke_build.py
      - name: Build using GitHub Pages Jekyll
        run: bundle exec jekyll build --baseurl /kaist-emc-lab
      - name: Validate generated JSON
        run: |
          python -c "import json; from pathlib import Path; [json.loads(Path('_site/data', name + '.json').read_text(encoding='utf-8-sig')) for name in ['publications', 'news', 'members', 'projects', 'announcement']]"
